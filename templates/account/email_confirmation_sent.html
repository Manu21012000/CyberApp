{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center mb-0">Email Confirmation Sent</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <p class="mb-0">We have sent an email to you for verification. Follow the link provided to finalize the signup process. Please contact us if you do not receive it within a few minutes.</p>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_login' %}" class="btn btn-outline-primary">Return to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
